name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pseudocode-tests:
    name: Testes em pseudocodigo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar testes TDD em pseudocodigo
        shell: pwsh
        run: ./scripts/run_pseudocode_tests.ps1
